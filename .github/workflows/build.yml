      - name: Fix Kotlin plugin conflict
        run: |
          APP_GRADLE=$(find project -path "*/app/build.gradle.kts" | head -n 1)
          if [ -z "$APP_GRADLE" ]; then
            echo "App Gradle file not found"
            exit 1
          fi
          sed -i '/org.jetbrains.kotlin.android/d' "$APP_GRADLE"

      - name: Build Nexora
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug

name: Nexora Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q ./*.zip -d project
          find project -name build.gradle.kts -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Nexora
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Client-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          
